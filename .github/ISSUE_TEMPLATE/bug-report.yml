name: Bug or reproducibility report
description: Report a failure with enough context for someone else to investigate.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include exact commands, environment details, and limitations. Do not attach private data or secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest command, fixture, or experiment manifest that reproduces it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python/toolchain, CPU, GPU, driver/API, and runtime commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, metrics, or evidence
      description: Paste relevant output and link public experiment artifacts where possible.
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
      description: What did you not test, or what conditions change the result?
