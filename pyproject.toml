[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceslug-main"
version = "0.1.0"
description = "Host orchestration and model laboratory for Spaceslug"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spaceslug = "spaceslug.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.setuptools.packages.find]
where = ["python"]
